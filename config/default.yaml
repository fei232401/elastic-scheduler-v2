# Elastic Training-Inference Scheduler — MVP Core 默认配置
# 所有 Mock 参数集中在此，代码不硬编码（spec §5/§8/§9/§13）

simulation:
  total_gpus: 8
  tick_seconds: 5          # 每个仿真 tick 对应的秒数
  duration_ticks: 840      # 70 min 潮汐周期（0-70min）
  seed: 42                 # 确定性随机种子（spec Step 9.5）

training:
  total_work: 100000
  initial_gpu: 6
  min_gpu: 1
  base_throughput: 15      # 单卡基准吞吐
  scaling_exponent: 0.85   # 幂律：throughput = base * gpu^0.85（spec §5 工程修正）
  max_allowed_slowdown: 3.0   # Training 被降级导致完成时间最多放大倍数（spec §12）

inference:
  capacity_per_gpu: 10     # 每卡 QPS 容量
  slo_p95_ms: 300
  overload_trigger_ticks: 3    # 连续 N tick P95>SLO 才认定为过载（spec §9 防抖）
  recovery_trigger_ticks: 5    # 连续 N tick 健康才认定为恢复
  # 延迟模型（超容量排队时的 P95 上限，非线性）
  p95_base_ms: 200
  p95_overload_ms: 900

scheduler:
  interval_ticks: 1            # 每个决策间隔的 tick 数
  max_scale_step: 1            # 一次最多 ±1 GPU（spec Rule 5）
  min_gpu_hold_duration_ticks: 24   # = 120s/5s：改配额后保护期内不再动（spec §11 修正）
  approach_ratio: 0.8          # P95 > 80%*SLO → 预警，不改配额（Rule 2）
  healthy_ratio: 0.6           # P95 < 60%*SLO → 可归还 GPU（Rule 3）
  cooldown_ticks: 30           # 额外防振荡冷却（可叠加 min_hold）
  preempt_min_training: 1      # Hard Preemption 让渡地板（默认=training.min_gpu，spec §3.2）

network:
  # 共享网络带宽模型（spec §13-§17）。默认 = GPU-bound（带宽远大于峰值需求）。
  total_bandwidth_mbps: 30000      # 网络总容量（实验间调整：A 大 / B 小 / C 中）
  base_latency_ms: 2               # 基础网络延迟
  latency_gain_per_overload: 250   # 拥塞延迟放大系数（利用率超过 threshold 后线性放大）
  congestion_start_util: 0.5       # 超过该利用率后开始出现拥塞延迟（回加推理 P95）
  # 训练带宽（spec §14 表）：2→500,3→900,4→1400,5→2000,6→2700 Mbps；g<2 为 0
  training_bw_scale: 1.0           # 缩放因子（实验间调整：A=1.0 陡 / B=0.2 平 / C=0.6）
  train_bw_coeff_a: 50
  train_bw_coeff_b: 150
  # 推理带宽（spec §15/§17）：QPS 驱动 + 每 GPU 边际带宽（实际占用 + 调度器预测共用）
  bw_per_qps: 20
  per_gpu_infer_bw: 100            # 每 GPU 推理带宽（网络感知闸门用，spec §17）
  # 拥塞回压（spec §16）：超载后训练吞吐打折
  training_penalty_per_unit: 0.3
  max_training_penalty: 0.7

traffic:
  # 默认潮汐 scenario（spec §9）：LOW→RISING→PEAK→FALLING→LOW，70min
  type: custom                # constant|step|sine|spike|custom
  # custom 模式：分段线性时间表 (min, qps)
  schedule:
    - {min: 0,  qps: 10}
    - {min: 5,  qps: 12}
    - {min: 10, qps: 18}
    - {min: 15, qps: 25}
    - {min: 20, qps: 35}
    - {min: 25, qps: 45}
    - {min: 30, qps: 55}
    - {min: 35, qps: 60}
    - {min: 40, qps: 55}
    - {min: 45, qps: 40}
    - {min: 50, qps: 25}
    - {min: 60, qps: 15}
    - {min: 70, qps: 10}
  # 其他模式参数（未用时可忽略）
  step_interval_min: 5
  step_low_qps: 10
  step_high_qps: 60
  sine_period_min: 30
  sine_amplitude: 25
  sine_base: 35
  spike_min: 30
  spike_qps: 60
  base_qps: 10
  jitter_ratio: 0.05       # 每 tick QPS 抖动幅度（确定性随机）
