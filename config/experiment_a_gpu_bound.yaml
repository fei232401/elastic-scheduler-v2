# Experiment A —— GPU-bound（网络富余，GPU 是唯一瓶颈）
# 目的：验证「网络不是约束」时，Network-aware 与 GPU-only Elastic 行为一致（无回归）。
# 网络容量 30000Mbps 远大于峰值需求（~4100），网络利用率最高 ~14%，拥塞延迟≈0。
# 基线同第一版 default（训练 6 卡 / 推理 2 卡 / 峰值 60 QPS）。

simulation:
  total_gpus: 8
  tick_seconds: 5
  duration_ticks: 840
  seed: 42

training:
  total_work: 100000
  initial_gpu: 6
  min_gpu: 1
  base_throughput: 15
  scaling_exponent: 0.85
  max_allowed_slowdown: 3.0

inference:
  capacity_per_gpu: 10
  slo_p95_ms: 300
  overload_trigger_ticks: 3
  recovery_trigger_ticks: 5
  p95_base_ms: 200
  p95_overload_ms: 900

scheduler:
  interval_ticks: 1
  max_scale_step: 1
  min_gpu_hold_duration_ticks: 24
  approach_ratio: 0.8
  healthy_ratio: 0.6
  cooldown_ticks: 30
  preempt_min_training: 1

network:
  total_bandwidth_mbps: 30000      # 远超峰值 → 永不拥塞
  base_latency_ms: 2
  latency_gain_per_overload: 250
  congestion_start_util: 0.5
  training_bw_scale: 1.0           # 训练带宽曲线陡（spec §14 原始表）
  train_bw_coeff_a: 50
  train_bw_coeff_b: 150
  bw_per_qps: 20
  per_gpu_infer_bw: 100            # 网络感知闸门保守度低
  training_penalty_per_unit: 0.3
  max_training_penalty: 0.7

traffic:
  type: custom
  schedule:
    - {min: 0,  qps: 10}
    - {min: 5,  qps: 12}
    - {min: 10, qps: 18}
    - {min: 15, qps: 25}
    - {min: 20, qps: 35}
    - {min: 25, qps: 45}
    - {min: 30, qps: 55}
    - {min: 35, qps: 60}
    - {min: 40, qps: 55}
    - {min: 45, qps: 40}
    - {min: 50, qps: 25}
    - {min: 60, qps: 15}
    - {min: 70, qps: 10}
  jitter_ratio: 0.05
