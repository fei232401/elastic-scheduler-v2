# Experiment Mild —— 网络严重度轴：轻度（exp B workload，网络容量 30000 Mbps）
#
# 用途：Phase 3.3 T3 网络严重度实验的「轻度」端。
# 设计：与 experiment_b_network_bound.yaml（严重端）共享全部 workload/潮汐/训练/推理参数，
# 仅把网络容量从 2200 提高到 30000 —— 网络永不拥塞（util ≤ ~0.15），§17 闸门从不拦截。
# 作用：证明「网络不构成约束时，network_aware == elastic（无回归）」，
#      即严重度轴的 0% 拥塞端。
# 注意：本配置与 experiment_a_gpu_bound.yaml 不同（A 是另一条 GPU-bound 场景），
#      本轴只变网络容量一个变量，用于 severity 对比。

simulation:
  total_gpus: 8
  tick_seconds: 5
  duration_ticks: 840
  seed: 42

training:
  total_work: 100000
  initial_gpu: 4          # 与 exp B 相同（推理初始 4 卡）
  min_gpu: 1
  base_throughput: 15
  scaling_exponent: 0.85
  max_allowed_slowdown: 3.0

inference:
  capacity_per_gpu: 10
  slo_p95_ms: 300
  overload_trigger_ticks: 3
  recovery_trigger_ticks: 5
  p95_base_ms: 200
  p95_overload_ms: 900

scheduler:
  interval_ticks: 1
  max_scale_step: 1
  min_gpu_hold_duration_ticks: 24
  approach_ratio: 0.8
  healthy_ratio: 0.6
  cooldown_ticks: 30
  preempt_min_training: 1

network:
  total_bandwidth_mbps: 30000     # 唯一变化：远超峰值需求 → 永不拥塞
  base_latency_ms: 2
  latency_gain_per_overload: 250
  congestion_start_util: 0.5
  training_bw_scale: 0.2
  train_bw_coeff_a: 50
  train_bw_coeff_b: 150
  bw_per_qps: 30
  per_gpu_infer_bw: 600
  training_penalty_per_unit: 0.3
  max_training_penalty: 0.7

traffic:
  type: custom
  schedule:
    - {min: 0,  qps: 10}
    - {min: 10, qps: 15}
    - {min: 15, qps: 22}
    - {min: 20, qps: 28}
    - {min: 25, qps: 30}
    - {min: 35, qps: 30}
    - {min: 40, qps: 25}
    - {min: 45, qps: 18}
    - {min: 50, qps: 12}
    - {min: 60, qps: 10}
    - {min: 70, qps: 10}
  jitter_ratio: 0.05
