# Experiment C —— GPU + Network 双瓶颈（两资源都逼近上限，真实取舍）
# 目的：验证双瓶颈并存时 Network-aware 是「中间态」——
#   GPU-only Elastic 持续扩容推理 → 每卡推理带宽(400) > 训练释放带宽(末段 360) →
#   推理加到 7 卡反而加重网络拥塞（overshoot，P95 不再改善，训练被压到 min）。
#   Network-aware 在网络饱和点拦截（spec §17：released < delta 即拒绝）→ 停在训练 3 卡，
#   保住训练、网络不超载，代价是峰值 P95 略高 ~15ms。这是真实的工程取舍。
# 设计要点：
#   - 训练曲线陡（scale 0.9）→ 前几次扩容释放带宽 > 新增（6→3 放行），末段（3→2）
#     released=360 < per_gpu=400 被拒；
#   - 尖锐延迟曲线（congestion_start_util=0.85, gain=1667）→ 只有 util>0.85 才显著加延迟，
#     峰值违约由网络驱动、低峰恢复干净（避免被网络延迟锁死无法归还 GPU）；
#   - max_allowed_slowdown=5.0 → 允许 elastic 一路压到 min（否则被 §12 挡住）。

simulation:
  total_gpus: 8
  tick_seconds: 5
  duration_ticks: 840
  seed: 42

training:
  total_work: 100000
  initial_gpu: 5
  min_gpu: 1
  base_throughput: 15
  scaling_exponent: 0.85
  max_allowed_slowdown: 5.0      # 放宽：凸显 GPU-only 硬压训练 vs 网络感知保训练

inference:
  capacity_per_gpu: 10
  slo_p95_ms: 300
  overload_trigger_ticks: 3
  recovery_trigger_ticks: 5
  p95_base_ms: 200
  p95_overload_ms: 900

scheduler:
  interval_ticks: 1
  max_scale_step: 1
  min_gpu_hold_duration_ticks: 24
  approach_ratio: 0.8
  healthy_ratio: 0.6
  cooldown_ticks: 30
  preempt_min_training: 1

network:
  total_bandwidth_mbps: 3800      # 峰值需求 ~4050 → 超容量 ~7%
  base_latency_ms: 2
  latency_gain_per_overload: 1667  # 尖锐曲线：util 0.85→0ms, util 1.0→~250ms
  congestion_start_util: 0.85
  training_bw_scale: 0.9          # 陡：6→3 释放带宽覆盖新增，3→2 开始不够
  train_bw_coeff_a: 50
  train_bw_coeff_b: 150
  bw_per_qps: 30
  per_gpu_infer_bw: 400           # 闸门阈值：released(3→2)=360 < 400 → 拒绝
  training_penalty_per_unit: 0.3
  max_training_penalty: 0.7

traffic:
  type: custom
  schedule:
    - {min: 0,  qps: 10}
    - {min: 10, qps: 18}
    - {min: 15, qps: 26}
    - {min: 20, qps: 32}
    - {min: 25, qps: 35}
    - {min: 45, qps: 35}
    - {min: 50, qps: 28}
    - {min: 55, qps: 18}
    - {min: 60, qps: 12}
    - {min: 70, qps: 10}
  jitter_ratio: 0.05
